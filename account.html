<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Group E - Account</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Ralepoma<span>Moviebox</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="browse.html">Browse</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="mylist.html">My List</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="account.html">Sign In</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Account section -->
    <section class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="account-box">

                    <h2>Welcome to Ralepoma movie box</h2>

                    <p>Sign in to your account</p>

                    <!-- Sign In Form -->
                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>

                            <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email"
                                name="Email"
                                maxlength="20"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input type="password" id="loginPassword" class="form-control"
                                   minlength="8"
                                       maxlength="15"
                                       name="password"
                                       pattern="(?=. *[a-z])(?=. *[A-Z])(?=. *[0-9])(?=. *[!@#$%^*]).{8,}"
                                       title="Password must have at least 8 characters, one number and one special character."
                                placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            Sign In
                        </button>

                    </form>


                    <hr>


                    <!-- Sign Up Form -->
                    <h3>Create an Account</h3>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <input type="text" id="fullName" class="form-control" placeholder="Enter your name"
                                 name="Fullname"
                                 maxlength="20"
                                 minlength="3"
                                 pattern="[A-Za-z]{1,20}"
                                 title="Enter letters only. Maximum of 20 characters and minimum of 3 characters"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>

                            <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email"
                                   maxlength="40"
                                   name="Email"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input type="password" id="registerPassword" class="form-control"
                                       minlength="8"
                                       maxlength="15"
                                       name="password"
                                       pattern="(?=. *[a-z])(?=. *[A-Z])(?=. *[0-9])(?=. *[!@#$%^*]).{8,}"
                                       title="Password must have at least 8 characters, one number and one special character."
                                placeholder="Create a password" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            Sign Up
                        </button>

                    </form>

                    <p id="accountMessage" class="mt-3"></p>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>© 2026 Ralepomamoviebox. All Rights Reserved.</p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
